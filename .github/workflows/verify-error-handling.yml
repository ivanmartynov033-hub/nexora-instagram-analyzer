name: Verify error handling in root main.py

on:
  push:
    branches:
      - fix/root-main-hardening-2026-11-11
    paths:
      - main.py
      - requirements.txt
      - .github/workflows/verify-error-handling.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  error-handling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx
      - name: Compile backend
        run: python -m py_compile main.py
      - name: Test Instagram 429 and Firecrawl 401/403 handling
        run: |
          python - <<'PY'
          import os
          from unittest.mock import patch
          from urllib.error import HTTPError
          from fastapi.testclient import TestClient
          import instaloader
          import main

          client = TestClient(main.app)

          # Instagram rate-limit detection and endpoint response when fallback has no data.
          assert main._is_instagram_rate_limit(Exception("429 Too Many Requests"))
          assert main._is_instagram_rate_limit(Exception("rate limit exceeded"))
          with patch.object(main, "collect_profile", side_effect=instaloader.exceptions.InstaloaderException("429 Too Many Requests")), \
               patch.object(main, "collect_profile_firecrawl", side_effect=LookupError("no public data")):
              response = client.post("/api/analyze", json={"username": "rate_limit_case"})
              assert response.status_code == 429, response.text
              assert "429" in response.json()["detail"]

          # Firecrawl HTTP 401 and 403 must become FirecrawlAuthError and must not
          # trigger the ordinary scrape fallback after Alexandria rejects auth.
          os.environ["FIRECRAWL_API_KEY"] = "test-key"
          for status in (401, 403):
              error = HTTPError("https://api.firecrawl.dev/v2/scrape", status, "auth rejected", {}, None)
              with patch.object(main, "urlopen", side_effect=error), \
                   patch.object(main, "collect_profile_firecrawl_scrape") as scrape_fallback:
                  try:
                      main.collect_profile_firecrawl("auth_case")
                      raise AssertionError(f"Expected FirecrawlAuthError for HTTP {status}")
                  except main.FirecrawlAuthError as exc:
                      assert f"HTTP {status}" in str(exc)
                  scrape_fallback.assert_not_called()

          # API maps Firecrawl auth errors to a gateway error with a clear message.
          with patch.object(main, "collect_profile", side_effect=instaloader.exceptions.InstaloaderException("temporary Instagram failure")), \
               patch.object(main, "collect_profile_firecrawl", side_effect=main.FirecrawlAuthError("Firecrawl HTTP 401")):
              response = client.post("/api/analyze", json={"username": "firecrawl_auth_case"})
              assert response.status_code == 502, response.text
              assert "Firecrawl HTTP 401" in response.json()["detail"]

          print("PASS: Instagram 429 response; Firecrawl 401/403 classification; no scrape retry after auth failure; API 502 mapping")
          PY
