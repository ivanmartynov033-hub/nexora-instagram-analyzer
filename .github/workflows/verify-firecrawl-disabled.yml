name: Verify Firecrawl disabled
on:
  workflow_dispatch:
  push:
    branches:
      - fix/root-main-hardening-2026-11-11
    paths:
      - main.py
      - .github/workflows/verify-firecrawl-disabled.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m py_compile main.py
      - name: Verify Firecrawl is not called
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import instaloader
          import main
          from unittest.mock import patch

          client = TestClient(main.app)
          sample = {
              "status": "ok",
              "checked_at": "2026-11-11T00:00:00Z",
              "elapsed_seconds": 0,
              "account": {"username": "sample", "followers": 100, "following": 10, "post_count": 1},
              "posts": [],
          }

          with patch.object(main, "collect_profile", side_effect=instaloader.exceptions.InstaloaderException("429 Too Many Requests")):
              with patch.object(main, "collect_profile_firecrawl", side_effect=AssertionError("Firecrawl fallback was called")) as fallback:
                  response = client.post("/api/analyze", json={"username": "sample429"})
                  assert response.status_code == 429, response.text
                  fallback.assert_not_called()

          with patch.object(main, "collect_profile", side_effect=instaloader.exceptions.InstaloaderException("temporary Instagram error")):
              with patch.object(main, "collect_profile_firecrawl", side_effect=AssertionError("Firecrawl fallback was called")) as fallback:
                  response = client.post("/api/analyze", json={"username": "sample502"})
                  assert response.status_code == 502, response.text
                  fallback.assert_not_called()

          with patch.object(main, "collect_profile", return_value=sample):
              with patch.object(main, "collect_profile_firecrawl", side_effect=AssertionError("Firecrawl fallback was called")) as fallback:
                  response = client.post("/api/analyze", json={"username": "sampleok"})
                  assert response.status_code == 200, response.text
                  assert response.json()["data_source"] == "instaloader"
                  fallback.assert_not_called()

          print("PASS: Instagram 429 mapping; generic error mapping; successful Instaloader response; Firecrawl fallback never called.")
          PY
